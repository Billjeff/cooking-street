<script>
(function(){
const W=1280,H=720,INK='#7a3f55';
const stage=document.getElementById('stage'),scene=document.getElementById('scene'),fx=document.getElementById('fx');
const capEl=document.getElementById('cap'),capText=document.getElementById('capText');
const hand=document.getElementById('hand');

/* ---------- fit ---------- */
let scale=1;
function fit(){
  const wr=document.getElementById('wrap');const w=wr.clientWidth,h=wr.clientHeight;
  scale=Math.min(w/W,h/H)*0.98;stage.style.transform='scale('+scale+')';
  document.getElementById('turn').hidden=!(h>w*1.1);
}
addEventListener('resize',fit);fit();
function toStage(e){const r=stage.getBoundingClientRect();const s=r.width/W;return{x:(e.clientX-r.left)/s,y:(e.clientY-r.top)/s};}

/* ---------- save: one profile per kid, kept in the artifact's database with a copy on this device ---------- */
const SAVE='cookingStreet.v1',PKEY='cookingStreet.players';
const blankSave=()=>({coins:0,bakes:0,unlocked:['cupcakes'],best:{}});
let save=blankSave(),player=null,players={};
try{const p=JSON.parse(localStorage.getItem(PKEY)||'null');if(p&&typeof p==='object')players=p;}catch(e){}
let legacy=null;try{if(!localStorage.getItem(SAVE+'.moved'))legacy=JSON.parse(localStorage.getItem(SAVE)||'null');}catch(e){}
let DB=null,dbState='loading',seeded=false,readOnly=false,onPlayers=()=>{};
function cacheLocal(){try{localStorage.setItem(PKEY,JSON.stringify(players));}catch(e){}}
const pend=new Set();let wloop=false;
function queueWrite(id){pend.add(id);if(DB&&!readOnly&&!wloop)runWrites();}
async function runWrites(){
  wloop=true;
  while(pend.size&&DB&&!readOnly){
    const id=pend.values().next().value;pend.delete(id);const body=players[id];
    try{if(body)await DB.doc('players/'+id).set(body);else await DB.doc('players/'+id).delete();}
    catch(e){const c=e&&e.code;if(c==='unavailable'||c==='resource_exhausted'){await new Promise(r=>setTimeout(r,1500+Math.random()*1500));if(!pend.has(id))pend.add(id);}else{readOnly=true;}}
  }
  wloop=false;
}
function persist(){
  if(!player)return;
  players[player.id]=Object.assign({},players[player.id],{name:player.name,animal:player.animal,color:player.color,coins:save.coins,bakes:save.bakes,unlocked:save.unlocked.slice(),best:Object.assign({},save.best),updated:Date.now()});
  cacheLocal();queueWrite(player.id);
}
function choosePlayer(id){
  const p=players[id];if(!p)return;
  player={id,name:p.name,animal:p.animal||'bunny',color:p.color||'#ffd6e6'};
  save={coins:p.coins|0,bakes:p.bakes|0,unlocked:Array.isArray(p.unlocked)?p.unlocked.slice():['cupcakes'],best:Object.assign({},p.best||{})};
  if(!save.unlocked.includes('cupcakes'))save.unlocked.unshift('cupcakes');
  try{localStorage.setItem(PKEY+'.last',id);}catch(e){}
  drawCoins();
}
function startDb(){
  let use=null;try{use=window.claude&&window.claude.use;}catch(e){}
  if(!use){dbState='local';return;}
  window.claude.use('db').then(db=>{
    if(!db){dbState='local';onPlayers();return;}
    DB=db;const timer=setTimeout(()=>{if(dbState==='loading'){dbState='slow';onPlayers();}},10000);
    DB.collection('players').onSnapshot(snap=>{
      if(snap.metadata.fromCache&&!seeded)return;
      clearTimeout(timer);
      const next={};snap.docs.forEach(d=>{const v=d.data();if(v)next[d.id]=JSON.parse(JSON.stringify(v));});
      if(!seeded){seeded=true;Object.keys(players).forEach(id=>{if(!next[id]){next[id]=players[id];pend.add(id);}});}
      pend.forEach(id=>{if(players[id])next[id]=players[id];else delete next[id];});
      if(player&&players[player.id])next[player.id]=players[player.id];
      players=next;cacheLocal();dbState='ok';if(pend.size&&!wloop)runWrites();onPlayers();
    },()=>{clearTimeout(timer);dbState='local';onPlayers();});
  }).catch(()=>{dbState='local';onPlayers();});
}

function hit(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}

let timers=[],intervals=[],rafs=[];
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function every(fn,ms){const t=setInterval(fn,ms);intervals.push(t);return t;}
function clearAll(){timers.forEach(clearTimeout);intervals.forEach(clearInterval);rafs.forEach(cancelAnimationFrame);timers=[];intervals=[];rafs=[];}

function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgbs(c){return'rgb('+c.map(v=>Math.round(v)).join(',')+')';}
function mix(h,target,t){const a=hex2rgb(h),b=hex2rgb(target);return rgbs(a.map((v,i)=>v+(b[i]-v)*t));}
function lerpCol(stops,t){
  for(let i=1;i<stops.length;i++){if(t<=stops[i][0]){const [t0,c0]=stops[i-1],[t1,c1]=stops[i];return mix(c0,c1,(t-t0)/(t1-t0));}}
  return mix(stops[stops.length-1][1],stops[stops.length-1][1],0);
}

function drag(n,o){
  o=o||{};
  n.addEventListener('pointerdown',e=>{
    if(n.dataset.lock)return;e.preventDefault();
    try{n.setPointerCapture(e.pointerId);}catch(_){}
    const p0=toStage(e),l0=parseFloat(n.style.left),t0=parseFloat(n.style.top);
    n.style.transition='none';n.classList.add('lift');o.start&&o.start(p0);
    const mv=ev=>{const p=toStage(ev);n.style.left=(l0+p.x-p0.x)+'px';n.style.top=(t0+p.y-p0.y)+'px';o.move&&o.move(p);};
    const up=ev=>{
      n.removeEventListener('pointermove',mv);n.removeEventListener('pointerup',up);n.removeEventListener('pointercancel',up);
      n.classList.remove('lift');n.style.transition='';
      o.end&&o.end(toStage(ev),()=>{n.style.left=l0+'px';n.style.top=t0+'px';});
    };
    n.addEventListener('pointermove',mv);n.addEventListener('pointerup',up);n.addEventListener('pointercancel',up);
  });
}

let AC=null,master=null,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.6;master.connect(AC.destination);startMusic();}catch(e){AC=null;}
}
function tone(f,d,type,v,delay,slide){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
function noise(d,v,freq,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0);const len=Math.floor(AC.sampleRate*d);
  const b=AC.createBuffer(1,len,AC.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1500;
  const g=AC.createGain();g.gain.value=v||.3;s.connect(f);f.connect(g);g.connect(master);s.start(t);
}

function makeBowl(x,y){
  const n=el('div','abs',bowlSVG());place(n,x,y,380,250);n.style.zIndex=5;

function drawBlob(b,k,i){
  const I=ING[k];if(!I||I.kind==='eggs')return;const [x,y]=SPOTS[i%SPOTS.length];
  const add=a=>b.blobs.appendChild(svgEl('ellipse',a));
  if(I.kind==='liquid')add({cx:190,cy:92,rx:120,ry:16,fill:I.col,opacity:.9});
  else if(I.kind==='powder'){add({cx:x,cy:y,rx:42,ry:14,fill:I.col});add({cx:x-8,cy:y-5,rx:20,ry:6,fill:'#fff',opacity:.5});}
  else if(I.kind==='solid'){add({cx:x,cy:y,rx:28,ry:11,fill:I.col});}
  else if(I.kind==='fruit'){add({cx:x-14,cy:y,rx:16,ry:10,fill:I.col,stroke:INK,'stroke-width':1.5});add({cx:x+14,cy:y+4,rx:16,ry:10,fill:I.col,stroke:INK,'stroke-width':1.5});}
  else if(I.kind==='ice'){for(let j=0;j<3;j++)add({cx:x+j*16-16,cy:y+(j%2)*5,rx:8,ry:7,fill:'#e6f6ff',stroke:'#7fa8c8','stroke-width':1.5});}

}

function sceneMix(){
  setStep('mix');kitchen();
  const R=run.R;
  const stain=el('canvas','fxcv');stain.width=1280;stain.height=720;stain.style.zIndex=3;const sctx=stain.getContext('2d');
  const BX=410,BY=290;
  const bowlN=el('div','abs',`<svg viewBox="0 0 460 310" width="460" height="310" overflow="visible">
<ellipse cx="230" cy="296" rx="190" ry="14" fill="#7a3f55" opacity=".15"/>
<ellipse cx="230" cy="96" rx="222" ry="84" fill="url(#gBowl)" stroke="${INK}" stroke-width="3"/>
<ellipse cx="230" cy="102" rx="204" ry="72" fill="url(#gBowlIn)"/></svg>`);place(bowlN,BX,BY,460,310);bowlN.style.zIndex=5;
  const CX=BX+230,CY=BY+108,RX=188,RY=62;
  const cv=el('canvas','mixcv');cv.width=2*(RX*2+20);cv.height=2*(RY*2+20);place(cv,CX-RX-10,CY-RY-10,RX*2+20,RY*2+20);cv.style.zIndex=6;
  const ctx=cv.getContext('2d');ctx.setTransform(2,0,0,2,0,0);const ox=RX+10,oy=RY+10;
  const front=el('div','abs',`<svg viewBox="0 0 460 310" width="460" height="310" overflow="visible"><path d="M8 96 A222 84 0 0 0 452 96 Q448 300 230 306 Q12 300 8 96Z" fill="url(#gBowl)" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M70 170 Q100 260 190 280" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".55"/><path d="M370 160 Q380 200 366 230" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".4"/></svg>`);place(front,BX,BY,460,310);front.style.zIndex=7;front.style.pointerEvents='none';
  const whisk=el('div','abs whisk',whiskSVG);place(whisk,CX-40,CY-170,80,200);whisk.style.zIndex=8;
  const meter=el('div','abs meter','<b></b>');place(meter,CX-170,630,340,34);meter.style.zIndex=9;const bar=meter.firstChild;
  const drops=el('canvas','fxcv');drops.width=1280;drops.height=720;drops.style.zIndex=20;const dctx=drops.getContext('2d');
  const pad=el('div','abs pad');place(pad,BX-140,BY-150,740,520);pad.style.zIndex=15;

  /* seed particles from what went into the bowl */
  const target=hex2rgb(R.batter);
  const P=[];
  const add=(n,col,cx,cy,rad,layer,size)=>{const c=hex2rgb(col);for(let i=0;i<n;i++){const a=Math.random()*6.283,d=Math.sqrt(Math.random())*rad;const x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d;P.push({r:Math.min(.95,Math.hypot(x,y)),th:Math.atan2(y,x),c:c.slice(),layer,s:size*(.8+Math.random()*.5)});}};
  let base=null;
  run.added.forEach((k,i)=>{
    const I=ING[k];if(!I||I.kind==='eggs')return;
    const a=i*2.3+.4,sx=Math.cos(a)*.42,sy=Math.sin(a)*.42;
    if(I.kind==='liquid'){add(320,I.col,0,0,.96,0,7);if(!base)base=hex2rgb(I.col);}
    else if(I.kind==='powder')add(170,I.col,sx,sy,.34,1,6);
    else if(I.kind==='solid')add(80,I.col,sx,sy,.17,2,6);
    else add(30,I.col,sx,sy,.1,2,4);
  });
  for(let i=0;i<(run.yolks||0);i++){const a=i*2.0+1.2;add(55,'#ffc21a',Math.cos(a)*.3,Math.sin(a)*.3,.11,3,6);add(30,'#fff7e0',Math.cos(a)*.3,Math.sin(a)*.3,.17,2,5);}
  P.sort((a,b)=>a.layer-b.layer);
  if(!base)base=hex2rgb(ING.flour.col);
  const base0=base.slice();
  const dist=c=>Math.abs(c[0]-target[0])+Math.abs(c[1]-target[1])+Math.abs(c[2]-target[2]);
  const D0=P.reduce((s,p)=>s+dist(p.c),0)/P.length+1;
  let prog=0;
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);ctx.save();
    ctx.beginPath();ctx.ellipse(ox,oy,RX,RY,0,0,7);ctx.clip();
    ctx.fillStyle=rgbs(base);ctx.fillRect(0,0,ox*2,oy*2);
    for(const p of P){const x=ox+p.r*RX*Math.cos(p.th),y=oy+p.r*RY*Math.sin(p.th);ctx.fillStyle=rgbs(p.c);ctx.beginPath();ctx.ellipse(x,y,p.s*1.25,p.s*.85,0,0,7);ctx.fill();}
    const g=ctx.createRadialGradient(ox-60,oy-30,10,ox,oy,RX);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(60,20,30,.18)');
    ctx.fillStyle=g;ctx.fillRect(0,0,ox*2,oy*2);
    ctx.restore();
  }
  draw();

  /* splash droplets with gravity, landing as splats and wall drips */
  const D=[],DR=[];let looping=false;
  function splash(x,y){
    const col=rgbs(base.map((v,i)=>(v*.5+target[i]*.5)*.88));
    for(let i=0;i<22;i++)D.push({x:x+(Math.random()-.5)*30,y,vx:(Math.random()-.5)*13,vy:-7-Math.random()*11,r:3+Math.random()*5,col,wall:Math.random()<.4,land:490+Math.random()*130});
    if(!looping){looping=true;rafs.push(requestAnimationFrame(loop));}
  }
  function splatAt(x,y,r,col,flat){
    sctx.fillStyle=col;sctx.beginPath();sctx.ellipse(x,y,r*(flat?2.2:1.4),r*(flat?.8:1.3),0,0,7);sctx.fill();sctx.strokeStyle='rgba(110,60,30,.4)';sctx.lineWidth=1.5;sctx.stroke();
    for(let k=0;k<4;k++){const a=Math.random()*6.28,d=r*(1.8+Math.random()*1.6);sctx.beginPath();sctx.ellipse(x+Math.cos(a)*d*(flat?1.6:1),y+Math.sin(a)*d*(flat?.4:1),r*.35,r*(flat?.2:.35),0,0,7);sctx.fill();}
    sctx.fillStyle='rgba(255,255,255,.5)';sctx.beginPath();sctx.ellipse(x-r*.4,y-r*.3,r*.5,r*.3,0,0,7);sctx.fill();
  }
  function loop(){
    dctx.clearRect(0,0,1280,720);
    for(let i=D.length-1;i>=0;i--){
      const d=D[i];d.vy+=.55;d.x+=d.vx;d.y+=d.vy;
      if(d.wall&&d.vy>0&&d.y<450&&Math.random()<.09){splatAt(d.x,d.y,d.r,d.col,false);DR.push({x:d.x,y:d.y+d.r,len:0,max:12+Math.random()*40,w:d.r*.7,col:d.col});sfx.drip();D.splice(i,1);continue;}
      if(d.vy>0&&d.y>=d.land){splatAt(d.x,d.land,d.r,d.col,true);D.splice(i,1);continue;}
      const sp=Math.hypot(d.vx,d.vy),ang=Math.atan2(d.vy,d.vx);
      dctx.save();dctx.translate(d.x,d.y);dctx.rotate(ang);dctx.fillStyle=d.col;dctx.beginPath();dctx.ellipse(0,0,d.r*(1+sp*.07),d.r,0,0,7);dctx.fill();dctx.strokeStyle='rgba(110,60,30,.45)';dctx.lineWidth=1.5;dctx.stroke();
      dctx.fillStyle='rgba(255,255,255,.6)';dctx.beginPath();dctx.ellipse(-d.r*.2,-d.r*.35,d.r*.4,d.r*.25,0,0,7);dctx.fill();dctx.restore();
    }
    for(const r of DR){if(r.len<r.max){r.len+=.6;sctx.fillStyle=r.col;sctx.beginPath();sctx.ellipse(r.x,r.y+r.len,r.w*.6,r.w*.8,0,0,7);sctx.fill();sctx.fillRect(r.x-r.w*.5,r.y,r.w,r.len);sctx.fillStyle='rgba(110,60,30,.25)';sctx.fillRect(r.x+r.w*.3,r.y,r.w*.2,r.len);}}
    if(D.length||DR.some(r=>r.len<r.max))rafs.push(requestAnimationFrame(loop));else looping=false;
  }

  say('Stir round and round. Watch it all blend! Not too fast or it splashes.');
  let last=null,lastT=0,tickAcc=0,finished=false,cool=0,sloshAcc=0;
  const angOf=p=>Math.atan2((p.y-CY)/RY,(p.x-CX)/RX);
  pad.addEventListener('pointerdown',e=>{
    if(finished)return;try{pad.setPointerCapture(e.pointerId);}catch(_){}
    last=angOf(toStage(e));lastT=performance.now();
    const mv=ev=>{
      const p=toStage(ev),now=performance.now();
      let nx=(p.x-CX)/RX,ny=(p.y-CY)/RY;const nr=Math.hypot(nx,ny);if(nr>.9){nx*=.9/nr;ny*=.9/nr;}
      const wx=CX+nx*RX,wy=CY+ny*RY;
      whisk.style.left=(wx-40)+'px';whisk.style.top=(wy-178)+'px';whisk.style.transform=`rotate(${nx*14+6}deg)`;
      const a=angOf(p);let d=a-last;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;last=a;
      const dt=Math.max(1,now-lastT);lastT=now;
      d=Math.max(-.6,Math.min(.6,d));const ad=Math.abs(d);
      if(ad/dt>.024&&now>cool){cool=now+900;run.score.splashes++;sfx.splat();meter.classList.add('fast');splash(wx,CY-RY);say('Whoa, slow down! Stir gently.');tag('Splash!',CX-50,BY-50,'#ff5f7e');later(()=>meter.classList.remove('fast'),600);return;}
      if(now<cool-450)return;
      const rw=Math.min(.9,nr);
      for(const q of P){
        const w=.18+1.1*Math.exp(-((q.r-rw)**2)/.03);
        q.th+=d*w;
        q.r=Math.max(.02,Math.min(.96,q.r+(Math.random()-.5)*.05*ad*w));
        const k=Math.min(1,.14*ad*w);
        q.c[0]+=(target[0]-q.c[0])*k;q.c[1]+=(target[1]-q.c[1])*k;q.c[2]+=(target[2]-q.c[2])*k;
      }
      const Dn=P.reduce((s,q)=>s+dist(q.c),0)/P.length;
      prog=Math.max(prog,Math.min(1,1-Dn/D0));
      base=base0.map((v,i)=>v+(target[i]-v)*Math.min(1,prog*1.15));
      bar.style.width=(Math.min(1,prog/.88)*100)+'%';
      draw();
      tickAcc+=ad;sloshAcc+=ad;if(sloshAcc>.9){sloshAcc=0;sfx.slosh();}
      if(prog>=.88&&!finished){
        finished=true;run.mixed=true;hintFn=null;bar.style.width='100%';
        let f=0;const t=every(()=>{f++;P.forEach(q=>{q.c=q.c.map((v,i)=>v+(target[i]-v)*.25);});base=base.map((v,i)=>v+(target[i]-v)*.25);draw();if(f>12)clearInterval(t);},40);
        sfx.cheer();say(run.score.splashes?'All mixed together!':'All mixed, and no splashes!');
        later(()=>goto(sceneShape),1900);
      }
    };
    const up=()=>{pad.removeEventListener('pointermove',mv);pad.removeEventListener('pointerup',up);pad.removeEventListener('pointercancel',up);};
    pad.addEventListener('pointermove',mv);pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
  });
  setHint(()=>({x:CX-130,y:CY,toX:CX+130,toY:CY}));
}

const ladleSVG=`<svg viewBox="0 0 90 170" width="100%" height="100%"><path d="M46 4 L50 112" stroke="url(#gSteel)" stroke-width="10" stroke-linecap="round"/><path d="M46 4 L50 112" stroke="#8d9bb0" stroke-width="1.5"/><path d="M14 120 Q14 160 46 162 Q78 160 78 120Z" fill="url(#gSteel)" stroke="${INK}" stroke-width="3"/><ellipse cx="46" cy="120" rx="32" ry="9" fill="url(#gTomato)" stroke="${INK}" stroke-width="2.5"/><rect x="40" y="0" width="14" height="40" rx="7" fill="url(#gLidPink)" stroke="${INK}" stroke-width="2.5"/></svg>`;
const potSVG=`<svg viewBox="0 0 220 170" width="100%" height="100%"><ellipse cx="110" cy="160" rx="96" ry="9" fill="#7a3f55" opacity=".15"/><path d="M14 50 L22 150 Q110 168 198 150 L206 50Z" fill="url(#gLidPink)" stroke="${INK}" stroke-width="3"/><ellipse cx="110" cy="50" rx="96" ry="22" fill="#ffd1e3" stroke="${INK}" stroke-width="3"/><ellipse cx="110" cy="54" rx="84" ry="15" fill="url(#gTomato)"/><circle cx="80" cy="52" r="3" fill="#3f8a2a"/><circle cx="130" cy="56" r="2.5" fill="#3f8a2a"/><path d="M30 70 Q34 120 50 144" stroke="#fff" stroke-width="8" opacity=".5" fill="none" stroke-linecap="round"/><text x="110" y="120" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="24" fill="#fff">SAUCE</text></svg>`;
function sceneSauce(){
  setStep('sauce');kitchen();
  const PX=440,PY=205;
  el('div','abs',boardSVG(470,450)).style.cssText+=`left:${PX-55}px;top:${PY-45}px;z-index:2`;
  const P=run.pizza=run.cake=makePizza();scene.appendChild(P);place(P,PX,PY);
  const cv=P.querySelector('.saucecv'),ctx=cv.getContext('2d');ctx.setTransform(2,0,0,2,0,0);
  el('div','abs',potSVG).style.cssText+='left:920px;top:380px;width:220px;height:170px;z-index:3';
  const ladle=el('div','abs tool2',ladleSVG);place(ladle,990,240,90,170);
  const meter=el('div','abs meter','<b></b>');place(meter,450,640,340,34);meter.style.zIndex=9;const bar=meter.firstChild;
  const G=cellsGrid(142,156,172),nIn=G.filter(g=>g.in).length,nOut=G.length-nIn;let cIn=0,cOut=0,done=false,warned=false;
  function paint(x,y){
    ctx.save();ctx.beginPath();ctx.arc(180,180,170,0,7);ctx.clip();
    const r=22,g=ctx.createRadialGradient(x-6,y-6,2,x,y,r);g.addColorStop(0,'#ff6a4d');g.addColorStop(.65,'#d8301c');g.addColorStop(1,'rgba(185,30,18,.9)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    if(Math.random()<.35){ctx.fillStyle=Math.random()<.6?'#4f8a32':'#8a1a10';ctx.beginPath();ctx.arc(x+(Math.random()-.5)*26,y+(Math.random()-.5)*26,1.5,0,7);ctx.fill();}
    ctx.restore();
    for(const c of G){if(!c.hit&&Math.hypot(c.x-x,c.y-y)<r-2){c.hit=true;if(c.in)cIn++;else{cOut++;if(!warned){warned=true;tag('Keep the crust clean!',PX+90,PY-40,'#ff9f43');say('Oops, that is the crust! Keep the sauce in the middle.');}}}}
  }
  const pad=el('div','abs pad');place(pad,PX-40,PY-40,440,440);pad.style.zIndex=15;

    const mv=ev=>{
      const q=toStage(ev),p={x:q.x-PX,y:q.y-PY};place(ladle,q.x-46,q.y-150);
      const dx=p.x-lp.x,dy=p.y-lp.y,d=Math.hypot(dx,dy);if(d<6)return;
      const n=Math.ceil(d/6);for(let s=1;s<=n;s++)paint(lp.x+dx*s/n,lp.y+dy*s/n);lp=p;if(++k%6===0)sfx.slosh();
      const cov=cIn/nIn;bar.style.width=(Math.min(1,cov/.9)*100)+'%';
      if(cov>=.9&&!done){done=true;hintFn=null;const mess=cOut/nOut;run.score.sauce=Math.max(0,1-mess*2.5);sfx.cheer();
        say(mess<.08?'Perfect sauce, and the crust is clean!':'Saucy! Try to keep the crust clean next time.');later(()=>goto(sceneToppings),1700);}
    };
    const up=()=>{pad.removeEventListener('pointermove',mv);pad.removeEventListener('pointerup',up);pad.removeEventListener('pointercancel',up);};
    pad.addEventListener('pointermove',mv);pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
  });

}

const cheeseBowlSVG=`<svg viewBox="0 0 80 80"><path d="M6 36 Q8 74 40 74 Q72 74 74 36Z" fill="url(#gBlue)" stroke="${INK}" stroke-width="2.5"/>${[[22,32,-20],[34,28,30],[46,30,-40],[58,32,10],[30,36,60],[50,36,-10],[40,24,80]].map(([x,y,r])=>`<rect x="${x-8}" y="${y-2.5}" width="16" height="5" rx="2.5" fill="#fff2b0" stroke="#d8b040" stroke-width="1" transform="rotate(${r} ${x} ${y})"/>`).join('')}<path d="M6 36 Q40 46 74 36" fill="none" stroke="${INK}" stroke-width="2.5"/></svg>`;
function sceneToppings(){
  setStep('toppings');kitchen();
  const P=run.pizza,o=run.order,PX=440,PY=205;
  el('div','abs',boardSVG(470,450)).style.cssText+=`left:${PX-55}px;top:${PY-45}px;z-index:2`;
  scene.appendChild(P);place(P,PX,PY);
  const ccv=P.querySelector('.cheesecv'),cx=ccv.getContext('2d');cx.setTransform(2,0,0,2,0,0);
  const tk=el('div','abs panel',`<h3>${CN()}’s order</h3><div class="cnt"></div>`);place(tk,24,200,350);
  const right=el('div','abs panel',`<h3>Cheese</h3><div class="row ch"></div><h3>Toppings</h3><div class="row tp"></div>`);place(right,866,170,356);
  const counts={};TOPKEYS.forEach(k=>counts[k]=0);
  const G=cellsGrid(138),nIn=G.length;let cIn=0,phase='cheese',doneBtn=null;
  function shred(x,y){
    cx.save();cx.translate(x,y);cx.rotate(Math.random()*3.14);cx.fillStyle=['#fff8dc','#fff0b8','#ffe89a'][Math.floor(Math.random()*3)];
    cx.beginPath();if(cx.roundRect)cx.roundRect(-8,-2.6,16,5.2,2.6);else cx.rect(-8,-2.6,16,5.2);cx.fill();cx.strokeStyle='rgba(200,150,40,.4)';cx.lineWidth=.8;cx.stroke();cx.restore();
  }
  function cheeseAt(x,y,spread,n){
    for(let i=0;i<n;i++){let a=Math.random()*6.28,d=Math.random()*spread,px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;if(Math.hypot(px-180,py-180)>148)continue;shred(px,py);
      for(const c of G)if(!c.hit&&Math.hypot(c.x-px,c.y-py)<15){c.hit=true;cIn++;}}
    if(phase==='cheese'&&cIn/nIn>=.72){phase='tops';pad.remove();sfx.cheer();say('Cheesy! Now add the toppings. Count them carefully!');tk.classList.add('pop');drawCnt();showDone();setHint(null);}
  }
  const bowl=el('button','tool',cheeseBowlSVG,right.querySelector('.ch'));bowl.setAttribute('aria-label','grated cheese');
  bowl.addEventListener('click',()=>{if(phase!=='cheese')return;sfx.sparkle();for(let i=0;i<8;i++){const a=Math.random()*6.28,d=Math.sqrt(Math.random())*125;cheeseAt(180+Math.cos(a)*d,180+Math.sin(a)*d,30,16);}});
  const pad=el('div','abs pad');place(pad,PX-30,PY-30,420,420);pad.style.zIndex=15;
  pad.addEventListener('pointerdown',e=>{
    if(phase!=='cheese')return;e.preventDefault();try{pad.setPointerCapture(e.pointerId);}catch(_){}
    let k=0;const mv=ev=>{const q=toStage(ev);cheeseAt(q.x-PX,q.y-PY,20,4);if(++k%5===0)sfx.tick();};mv(e);
    const up=()=>{pad.removeEventListener('pointermove',mv);pad.removeEventListener('pointerup',up);pad.removeEventListener('pointercancel',up);};
    pad.addEventListener('pointermove',mv);pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
  });
  function drawCnt(){
    let h='';Object.keys(o.tops).forEach(k=>{h+=`<div class="tl${counts[k]===o.tops[k]?' ok':''}"><span class="ti">${TOPS[k].svg}</span><b>${counts[k]}</b><span>/ ${o.tops[k]} ${topWord(k,o.tops[k])}</span></div>`;});
    TOPKEYS.forEach(k=>{if(!o.tops[k]&&counts[k])h+=`<div class="tl bad"><span class="ti">${TOPS[k].svg}</span><b>${counts[k]}</b><span>not ordered!</span></div>`;});
    if(phase==='cheese')h='<div class="tl">First, sprinkle on the cheese.</div>'+h;
    tk.querySelector('.cnt').innerHTML=h;
  }
  drawCnt();
  const layer=P.querySelector('.tops');
  function addPiece(k){
    let x,y,t=0;const ps=[...layer.children].map(c=>[parseFloat(c.style.left),parseFloat(c.style.top)]);
    do{const a=Math.random()*6.28,d=25+Math.random()*105;x=180+Math.cos(a)*d;y=180+Math.sin(a)*d;t++;}while(t<40&&ps.some(([a,b])=>Math.hypot(a-x,b-y)<40));
    const n=el('div',null,TOPS[k].svg,layer);n.dataset.k=k;n.style.transform=`rotate(${Math.random()*360}deg)`;place(n,x,y);
    n.animate([{transform:'translateY(-60px) scale(1.4)',opacity:0},{transform:'none',opacity:1}],{duration:260,easing:'ease-out'});
    drag(n,{start(){sfx.pop();},end(){const lx=parseFloat(n.style.left),ly=parseFloat(n.style.top),d=Math.hypot(lx-180,ly-180);
      if(d>176){n.remove();counts[k]--;drawCnt();sfx.boing();say('Taken off!');}
      else if(d>140){place(n,180+(lx-180)*140/d,180+(ly-180)*140/d);}}});
    counts[k]++;drawCnt();sfx.plop();
    const want=o.tops[k]||0;
    if(!want)say('Hmm, '+CN()+' did not ask for '+TOPS[k].many+'. Drag it off the pizza!');
    else if(counts[k]===want)say(want+' '+topWord(k,want)+', just right!');
    else if(counts[k]>want)say('That is too many '+TOPS[k].many+'! Drag one off the pizza.');
  }
  TOPKEYS.forEach(k=>{
    const b=el('button','tool',TOPS[k].svg,right.querySelector('.tp'));b.setAttribute('aria-label',TOPS[k].many);b.title=TOPS[k].many;b.dataset.k=k;
    b.addEventListener('click',()=>{if(phase!=='tops'){wobble(b);say('Cheese first! Then the toppings.');return;}wobble(b);addPiece(k);});
  });
  function showDone(){if(doneBtn)return;doneBtn=bigButton('Into the oven!',890,612,'',()=>{
    let s=0,exact=true;const kinds=Object.keys(o.tops);
    kinds.forEach(k=>{const d=Math.abs(counts[k]-o.tops[k]);s+=d===0?1:d===1?.5:0;if(d)exact=false;});
    let extra=0;TOPKEYS.forEach(k=>{if(!o.tops[k])extra+=counts[k];});if(extra)exact=false;

const cutterSVG=`<svg viewBox="0 0 80 160" width="100%" height="100%"><rect x="32" y="60" width="16" height="96" rx="8" fill="url(#gLidPink)" stroke="${INK}" stroke-width="2.5"/><rect x="36" y="40" width="8" height="30" fill="url(#gSteel)" stroke="${INK}" stroke-width="2"/><circle cx="40" cy="30" r="27" fill="url(#gChrome)" stroke="${INK}" stroke-width="3"/><circle cx="40" cy="30" r="6" fill="#ff4d8d"/></svg>`;
function sceneSlice(){
  setStep('slice');kitchen();
  const P=run.pizza,PX=460,PY=190,C={x:PX+180,y:PY+180};
  el('div','abs',boardSVG(470,450)).style.cssText+=`left:${PX-55}px;top:${PY-45}px;z-index:2`;
  scene.appendChild(P);place(P,PX,PY);P.style.pointerEvents='none';
  const cuts=P.querySelector('.cuts'),angles=[];
  const prev=svgEl('line',{stroke:'#ff4d8d','stroke-width':4,'stroke-dasharray':'10 8',opacity:0});cuts.appendChild(prev);
  const cutter=el('div','abs tool2',cutterSVG);place(cutter,1010,300,80,160);
  const pad=el('div','abs pad');place(pad,PX-80,PY-80,520,520);pad.style.zIndex=15;
  say('Slice the pizza into 8 pieces! Drag the cutter right across the middle, 4 times.');
  function line(a){const dx=Math.cos(a)*176,dy=Math.sin(a)*176;return{x1:180-dx,y1:180-dy,x2:180+dx,y2:180+dy};}
  pad.addEventListener('pointerdown',e=>{
    if(angles.length>=4)return;e.preventDefault();try{pad.setPointerCapture(e.pointerId);}catch(_){}
    const s=toStage(e);
    const mv=ev=>{const q=toStage(ev);place(cutter,q.x-40,q.y-30);const a=Math.atan2(q.y-s.y,q.x-s.x);if(Math.hypot(q.x-s.x,q.y-s.y)>40){const L=line(a);for(const k in L)prev.setAttribute(k,L[k]);prev.setAttribute('opacity',.8);}};
    const up=ev=>{
      pad.removeEventListener('pointermove',mv);pad.removeEventListener('pointerup',up);pad.removeEventListener('pointercancel',up);prev.setAttribute('opacity',0);
      const q=toStage(ev),dx=q.x-s.x,dy=q.y-s.y,len=Math.hypot(dx,dy);
      if(len<160){say('Drag the cutter all the way across the pizza!');return;}
      const dist=Math.abs(dx*(s.y-C.y)-dy*(s.x-C.x))/len;
      if(dist>60){tag('Through the middle!',C.x-90,PY-50,'#ff9f43');say('Cut right through the middle of the pizza!');return;}
      let a=Math.atan2(dy,dx);a=((a%Math.PI)+Math.PI)%Math.PI;
      if(angles.some(b=>{const d=Math.abs(a-b);return Math.min(d,Math.PI-d)<.2;})){say('You already cut there. Try a new spot!');return;}
      angles.push(a);sfx.chop();const L=line(a);
      cuts.appendChild(svgEl('line',Object.assign({stroke:'#8a4a20','stroke-width':5,'stroke-linecap':'round',opacity:.85},L)));
      cuts.appendChild(svgEl('line',Object.assign({stroke:'#ffe9b0','stroke-width':1.5,opacity:.8},L)));
      if(angles.length===4){
        hintFn=null;const s2=angles.slice().sort((x,y)=>x-y);const gaps=s2.map((v,i)=>(i<3?s2[i+1]:s2[0]+Math.PI)-v);
        const dev=gaps.reduce((t,g)=>t+Math.abs(g-Math.PI/4),0)/4;run.score.slice=Math.max(0,1-dev/(Math.PI/4));
        sfx.cheer();say(run.score.slice>.75?'Eight even slices! Perfect!':'Eight slices, ready to eat!');
        later(()=>goto(sceneServe),1800);
      }else say(['','Good cut! 3 more.','2 more cuts!','One more cut!'][angles.length]);
    };
    pad.addEventListener('pointermove',mv);pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
  });
  setHint(()=>{const a=[0,Math.PI/2,Math.PI/4,3*Math.PI/4].find(x=>!angles.some(b=>Math.abs(b-x)<.3));if(a==null)return null;return{x:C.x-Math.cos(a)*190,y:C.y-Math.sin(a)*190,toX:C.x+Math.cos(a)*190,toY:C.y+Math.sin(a)*190};});
}

function scoreParts(){
  const S=run.score,R=run.R,o=run.order,N=CN();
  if(R.shop==='pizza')return{parts:[
    [Math.max(2,10-3*S.mistakes),10,'Tip: only use what is on the recipe card.'],
    [Math.max(2,8-2*S.splashes),8,'Tip: stir gently so nothing splashes.'],
    [Math.round(10*S.stretch),10,'Tip: roll the dough in different directions to keep it round.'],
    [Math.round(10*S.sauce),10,'Tip: keep the sauce off the crust.'],
    [Math.round(25*S.tops),25,'Tip: count the toppings on '+N+'’s order.'],
    [Math.round(S.temp*1.2),12,'Tip: set the oven to the temperature on the recipe card.'],
    [S.bake,15,'Tip: take it out when the arrow is in the gold zone.'],
    [Math.round(10*S.slice),10,'Tip: cut straight through the middle, evenly spaced.']],matched:!!S.topsExact};
  const frostOK=run.frost===o.frost,extraOK=R.extra==='topper'?run.toppers.includes(o.extra):run.sprinkles.includes(o.extra);
  const order=[(frostOK?13:0)+(extraOK?12:0),25,'Next time, match '+N+'’s order exactly!'];
  if(R.shop==='smoothie')return{parts:[
    [Math.max(3,12-4*S.mistakes),12,'Tip: only use what is on the recipe card.'],
    [Math.round(13*S.chop),13,'Tip: cut right on the dotted lines.'],
    [Math.max(0,10-5*S.order),10,'Tip: liquids go into the blender first.'],
    [S.nolid?0:5,5,'Tip: always put the lid on before blending!'],
    [Math.round(20*S.blend),20,'Tip: stop blending when the arrow is in the gold zone.'],
    [Math.round(15*S.pour),15,'Tip: stop pouring at the dotted line.'],
    order],matched:frostOK&&extraOK};
  return{parts:[
    [Math.max(3,12-4*S.mistakes),12,'Tip: only use what is on the recipe card.'],
    [3,3,''],
    [Math.max(3,12-3*S.splashes),12,'Tip: stir gently so nothing splashes.'],
    [Math.round(13*S.shape),13,R.shape==='pour'?'Tip: stop pouring at the dotted line.':R.shape==='cups'?'Tip: let go of the cup right at the dotted line.':'Tip: take your time shaping the dough.'],
    [Math.round(S.temp*1.5),15,'Tip: set the oven to the temperature on the recipe card.'],
    [S.bake,15,'Tip: take it out when the arrow is in the gold zone.'],
    order],matched:frostOK&&extraOK};
}

/* =================================================================== PLAYERS */
const ANIMALS=['bunny','puppy','kitten'];
const PCOLS=['#ffd6e6','#ffe2b8','#d6f5c8','#cfe6ff','#e6d6ff','#fff2a8'];
const headSVG=(kind,bg)=>`<svg viewBox="0 0 200 200" width="100%" height="100%"><circle cx="100" cy="100" r="96" fill="${bg}" stroke="#fff" stroke-width="8"/><clipPath id="hc${kind}${bg.slice(1)}"><circle cx="100" cy="100" r="92"/></clipPath><g clip-path="url(#hc${kind}${bg.slice(1)})"><svg x="10" y="6" width="180" height="270" viewBox="0 0 200 300">${inner(custSVG(kind))}</svg></g></svg>`;
const starCount=p=>Object.values((p&&p.best)||{}).reduce((a,b)=>a+(b|0),0);
function scenePlayers(){
  run=null;player=null;setStep(null);scene.innerHTML=STREETBG;capEl.classList.add('low');
  document.getElementById('coins').style.visibility='hidden';
  el('div','abs title','Who is cooking?');
  const wrap=el('div','abs pwrap');place(wrap,40,214,1200,380);
  const note=el('div','abs pnote');place(note,0,186,1280);
  let confirmEl=null;
  function render(){
    if(confirmEl)return;
    wrap.innerHTML='';
    const ids=Object.keys(players).filter(id=>players[id]).sort((a,b)=>(players[a].created||0)-(players[b].created||0));
    ids.forEach(id=>{
      const p=players[id];
      const c=el('div','pcard',`<div class="av">${headSVG(ANIMALS.includes(p.animal)?p.animal:'bunny',PCOLS.includes(p.color)?p.color:PCOLS[0])}</div><div class="nm"></div><div class="st"><span>${coinSVG}${p.coins|0}</span><span>${STAR(true)}${starCount(p)}</span></div><button class="del" aria-label="Delete this chef">✕</button>`,wrap);
      c.querySelector('.nm').textContent=p.name||'Chef';c.setAttribute('role','button');c.setAttribute('aria-label','Play as '+(p.name||'Chef'));
      c.addEventListener('click',e=>{if(e.target.closest('.del'))return;sfx.pop();choosePlayer(id);goto(sceneStreet);});
      c.querySelector('.del').addEventListener('click',e=>{e.stopPropagation();askDelete(id);});
    });
    if(ids.length<6){const n=el('div','pcard new','<div class="plus">+</div><div class="nm">New chef</div>',wrap);n.setAttribute('role','button');n.setAttribute('aria-label','Add a new chef');n.addEventListener('click',()=>{sfx.pop();goto(sceneNewPlayer);});}
    note.textContent=dbState==='loading'?'Loading saved chefs…':dbState==='ok'?(readOnly?'Saves are kept on this device.':'Saved to your Claude account, so every device keeps the same progress.'):dbState==='slow'?'Can’t reach saved chefs yet. Showing this device’s saves.':'Saves are kept on this device.';
    say(ids.length?'Who is cooking today? Tap your chef!':'Hi! Make a chef for each player. Tap New chef.');
    setHint(()=>ids.length?null:{x:640,y:370});
  }
  function askDelete(id){
    const p=players[id];confirmEl=el('div','abs pconfirm',`<h3></h3><p>All coins and unlocked recipes for this chef will be gone.</p><div class="row"><button class="big">Keep</button><button class="big pink">Delete</button></div>`);
    confirmEl.querySelector('h3').textContent='Delete '+(p.name||'this chef')+'?';place(confirmEl,340,180,600);
    const [keep,del]=confirmEl.querySelectorAll('button');
    keep.addEventListener('click',()=>{sfx.pop();confirmEl.remove();confirmEl=null;render();});
    del.addEventListener('click',()=>{sfx.boing();delete players[id];cacheLocal();queueWrite(id);confirmEl.remove();confirmEl=null;render();});
  }
  onPlayers=render;render();
}
function sceneNewPlayer(){
  onPlayers=()=>{};setStep(null);scene.innerHTML=STREETBG;capEl.classList.add('low');
  document.getElementById('coins').style.visibility='hidden';
  let animal=ANIMALS[Object.keys(players).length%3],color=PCOLS[Object.keys(players).length%PCOLS.length];
  const pnl=el('div','abs panel newp',`<h3>What is your name?</h3><input type="text" maxlength="12" autocomplete="off" spellcheck="false" aria-label="Your name" placeholder="Type your name"><h3>Pick your animal</h3><div class="row an"></div><h3>Pick your colour</h3><div class="row co"></div>`);
  place(pnl,250,90,520);
  const prev=el('div','abs pprev');place(prev,830,150,300,300);
  const input=pnl.querySelector('input');
  const draw=()=>{prev.innerHTML=headSVG(animal,color);pnl.querySelectorAll('.an button').forEach(b=>b.classList.toggle('on',b.dataset.a===animal));pnl.querySelectorAll('.co button').forEach(b=>b.classList.toggle('on',b.dataset.c===color));};
  ANIMALS.forEach(a=>{const b=el('button','pick',headSVG(a,'#fff'),pnl.querySelector('.an'));b.dataset.a=a;b.setAttribute('aria-label',a);b.addEventListener('click',()=>{sfx.pop();animal=a;draw();});});
  PCOLS.forEach(c=>{const b=el('button','sw',null,pnl.querySelector('.co'));b.style.background=c;b.dataset.c=c;b.setAttribute('aria-label','colour');b.addEventListener('click',()=>{sfx.pop();color=c;draw();});});
  draw();
  const go=bigButton('Let’s cook!',850,470,'',()=>{
    const name=input.value.trim().slice(0,12);
    if(!name){sfx.nope();wobble(input);say('Type your name first!');input.focus();return;}
    const id='p'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);
    let start=blankSave();
    if(legacy&&!Object.keys(players).length){start=Object.assign(blankSave(),{coins:legacy.coins|0,bakes:legacy.bakes|0,unlocked:Array.isArray(legacy.unlocked)?legacy.unlocked:['cupcakes']});legacy=null;try{localStorage.setItem(SAVE+'.moved','1');}catch(e){}}
    players[id]=Object.assign({name,animal,color,created:Date.now(),updated:Date.now()},start);
    cacheLocal();queueWrite(id);choosePlayer(id);goto(sceneStreet);
  });
  const back=bigButton('Back',905,580,'pink',()=>goto(scenePlayers));back.style.fontSize='28px';
  input.addEventListener('keydown',e=>{if(e.key==='Enter')go.click();});
  say('Type your name, then pick your animal and colour.');
  later(()=>{try{input.focus();}catch(e){}},300);
}

startDb();
goto(scenePlayers);
})();
</script>
